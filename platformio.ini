[platformio]
default_envs = m5stack-cores3

[env]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified @ ^0.2.7
  bblanchon/ArduinoJson @ ^6.21.5
build_flags =
  -DCORE_DEBUG_LEVEL=1

[env:m5stack-core2]
board = m5stack-core2
upload_speed = 1500000
build_src_filter =
  +<*>
  -<main_sticks3.cpp>

[env:m5stack-cores3]
board = m5stack-cores3
upload_speed = 921600
build_src_filter =
  +<*>
  -<main_sticks3.cpp>

[env:m5stack-sticks3]
board = esp32-s3-devkitc-1
upload_speed = 921600
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter =
  +<*>
  -<main.cpp>
build_flags =
  ${env.build_flags}
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCODEX_MICRO_STICKS3=1
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified
  M5PM1=https://github.com/m5stack/M5PM1
  bblanchon/ArduinoJson @ ^6.21.5

[env:native]
platform = native
framework =
lib_deps =
build_flags =
  -std=c++17
test_framework = unity
test_filter = test_sticks3_buttons
